[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dl_nlp_inference_api"
version = "0.1.0"
description = "Fine-tuning de Transformers e API de inferencia assincrona com FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0,<3.0.0",
    "transformers>=4.38.0,<5.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "ruff>=0.3.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]